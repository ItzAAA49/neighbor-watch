name: Verify and package Neighbor Watch

on:
  push:
    paths:
      - '.github/workflows/build-audited-package.yml'
      - 'ui-patch/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: neighbor-watch-audit-package
  cancel-in-progress: false

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.1'

      - name: Extract and apply the reviewed UI patch
        shell: bash
        run: |
          set -euo pipefail
          unzip -q neighbor-watch.zip -d .
          cat ui-patch/chunks/part-*.b64 | base64 --decode | bunzip2 -c > /tmp/neighbor-watch-ui.patch
          patch --dry-run -p1 -d . < /tmp/neighbor-watch-ui.patch
          patch -p1 -d . < /tmp/neighbor-watch-ui.patch
          node -e "const p=require('./neighbor-watch/package.json'); if(p.version !== '1.3.0') throw new Error('Expected UI package v1.3.0; got '+p.version); console.log('UI package version:',p.version)"

      - name: Install dependencies and run full test suite
        working-directory: neighbor-watch
        run: |
          npm install --omit=dev --no-audit --no-fund
          npm test

      - name: Repackage without node_modules for safe Render extraction
        shell: bash
        run: |
          set -euo pipefail
          rm -f neighbor-watch.zip
          zip -qr -9 neighbor-watch.zip neighbor-watch -x 'neighbor-watch/node_modules/*' 'neighbor-watch/node_modules/**'
          unzip -t neighbor-watch.zip
          if unzip -Z1 neighbor-watch.zip | grep -q '^neighbor-watch/node_modules/'; then
            echo "node_modules must not be included in the deploy archive" >&2
            exit 1
          fi
          sha256sum neighbor-watch.zip
          stat -c 'Audited deploy ZIP size: %s bytes' neighbor-watch.zip

      - name: Publish verified package to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add neighbor-watch.zip
          if git diff --cached --quiet; then
            echo "Verified package is already up to date."
          else
            git commit -m "Package verified Neighbor Watch v1.3.0 booth redesign"
            git push origin HEAD:main
          fi
