name: Verify and package Neighbor Watch

on:
  push:
    paths:
      - '.github/workflows/build-audited-package.yml'
      - 'scripts/rebuild-readable-menu.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: neighbor-watch-audit-package
  cancel-in-progress: false

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.1'

      - name: Build package from maintained source
        shell: bash
        run: |
          set -euo pipefail
          test -f source/neighbor-watch/package.json
          rm -rf neighbor-watch
          cp -a source/neighbor-watch neighbor-watch
          node scripts/rebuild-readable-menu.js neighbor-watch
          node -e "const p=require('./neighbor-watch/package.json'); if(p.version !== '1.4.0') throw new Error('Unexpected package version '+p.version); console.log('Verified package:',p.version)"

      - name: Install dependencies and run all tests
        working-directory: neighbor-watch
        run: |
          npm install --omit=dev --no-audit --no-fund
          npm test

      - name: Repackage without node_modules
        shell: bash
        run: |
          set -euo pipefail
          rm -f neighbor-watch.zip
          zip -qr -9 neighbor-watch.zip neighbor-watch -x 'neighbor-watch/node_modules/*' 'neighbor-watch/node_modules/**'
          unzip -t neighbor-watch.zip
          if unzip -Z1 neighbor-watch.zip | grep -q '^neighbor-watch/node_modules/'; then
            echo "node_modules must not be included in the deploy archive" >&2
            exit 1
          fi
          sha256sum neighbor-watch.zip
          stat -c 'Audited deploy ZIP size: %s bytes' neighbor-watch.zip

      - name: Publish verified package to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add neighbor-watch.zip
          if git diff --cached --quiet; then
            echo "Verified package is already up to date."
          else
            git commit -m "Publish tested Neighbor Watch maintenance build"
            git push origin HEAD:main
          fi
